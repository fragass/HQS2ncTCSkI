<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Página inicial - Workday CNX</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <script>
    if (!sessionStorage.getItem("token")) {
      window.location.href = "index.html";
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="mainWrapper">
    <div class="game-area">
      <div class="side-panel left-panel">
        <div class="card">
          <h3>Comandos</h3>
          <ul>
            <li><span class="key">←</span> Mover esquerda</li>
            <li><span class="key">→</span> Mover direita</li>
            <li><span class="key">↓</span> Soft drop</li>
            <li><span class="key">↑</span> Rotacionar</li>
            <li><span class="key">Espaço</span> Hard drop</li>
            <li><span class="key">C</span> Hold</li>
            <li><span class="key">P</span> Pausar</li>
            <li><span class="key">R</span> Reiniciar</li>
            <li><span class="key">Esc</span> Fecha menu</li>
          </ul>
        </div>
      </div>

      <div class="arena-wrapper">
        <canvas id="tetris" width="200" height="400" aria-label="Área principal do Tetris"></canvas>
        <div id="scoreboard" aria-live="polite">Score: 0 | Linhas: 0 | Level: 1 | Recorde: 0</div>
      </div>

      <div class="side-panel right-panel">
        <div class="profile-menu" id="profileMenu">
          <button id="mini-profile" type="button" aria-haspopup="menu" aria-expanded="false">
            <span id="user-phone"></span>
            <svg id="arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div id="dropdown-menu" role="menu" aria-hidden="true">
            <button id="logout" type="button" role="menuitem">Sair</button>
          </div>
        </div>

        <div class="next-box">
          <h2>Próximas Peças</h2>
          <div class="next-box-canvases">
            <canvas id="next1" width="100" height="100" aria-label="Próxima peça 1"></canvas>
            <canvas id="next2" width="100" height="100" aria-label="Próxima peça 2"></canvas>
            <canvas id="next3" width="100" height="100" aria-label="Próxima peça 3"></canvas>
          </div>
        </div>

        <div class="controls-side">
          <button id="startPauseBtn" class="btn start" type="button">Iniciar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="overlayPopup">
    <h2 id="overlayTitle">TETRIS</h2>
    <p id="overlayInfo">Pressione iniciar para começar.</p>
    <button id="overlayBtn" class="btn" type="button">Iniciar</button>
  </div>

<span style="position:fixed; bottom:10px; left:10px; opacity:.6; font-size:11px; z-index:999;">
v0.9 (2026.03.07) — Funcional
</span>

  <script>
    const user = sessionStorage.getItem("loggedUser") || "Jogador";
    document.getElementById("user-phone").textContent = user;

    const profileMenu = document.getElementById("profileMenu");
    const miniProfile = document.getElementById("mini-profile");
    const dropdownMenu = document.getElementById("dropdown-menu");
    const arrow = document.getElementById("arrow");

    function setMenuState(open) {
      dropdownMenu.style.display = open ? "block" : "none";
      dropdownMenu.setAttribute("aria-hidden", String(!open));
      miniProfile.setAttribute("aria-expanded", String(open));
      arrow.style.transform = open ? "rotate(180deg)" : "rotate(0deg)";
    }

    miniProfile.addEventListener("click", () => {
      const open = dropdownMenu.style.display === "block";
      setMenuState(!open);
    });

    document.getElementById("logout").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "index.html";
    });

    document.addEventListener("click", (e) => {
      if (!profileMenu.contains(e.target)) {
        setMenuState(false);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        setMenuState(false);
      }
    });
  </script>

  <script src="js/script.js"></script>
</body>
</html>
