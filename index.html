<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Workday CNX</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="css/loginf.css">
</head>
<body>
  <main class="login-shell">
    <div class="login-card">
      <div class="login-head">
        <span class="login-badge">WORKDAY CNX</span>
        <h1>Acesso</h1>
        <p>Entre com seu usuário e senha para abrir o jogo.</p>
      </div>

      <form id="loginForm" novalidate>
        <label class="sr-only" for="username">Usuário</label>
        <input type="text" id="username" placeholder="Usuário" autocomplete="username" autocapitalize="off" spellcheck="false" required>

        <label class="sr-only" for="password">Senha</label>
        <input type="password" id="password" placeholder="Senha" autocomplete="current-password" required>

        <button type="submit" id="loginButton">Entrar</button>
      </form>

      <p id="errorMsg" role="alert" aria-live="polite"></p>
    </div>
  </main>

  <script src="js/loginf.js"></script>
</body>
</html>
